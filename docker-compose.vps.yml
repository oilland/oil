# ─────────────────────────────────────────────────────────────
#  روغن‌لند — استقرار روی VPS (سرور مجازی ایران)
#  اپ + PostgreSQL + Redis + Caddy (HTTPS خودکار)
#
#  راه‌اندازی:   docker compose -f docker-compose.vps.yml up -d --build
#  راهنمای کامل فارسی: RUN-ON-VPS.md
# ─────────────────────────────────────────────────────────────
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oilshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: oilshop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oilshop']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://oilshop:${POSTGRES_PASSWORD}@db:5432/oilshop?schema=public
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET}
      APP_URL: ${APP_URL}
      NEXT_PUBLIC_APP_URL: ${APP_URL}
    expose:
      - '3000'
    # پورت مستقیم برای تست اولیه با IP (قبل از وصل‌شدن دامنه).
    # بعد از اطمینان می‌توانی این دو خط را حذف کنی تا فقط از طریق دامنه/Caddy باز شود.
    ports:
      - '3000:3000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
