# ─────────────────────────────────────────────────────────────
#  Oil Shop — PRODUCTION stack (app + PostgreSQL + Redis)
#  Deploy:  docker compose up -d --build
# ─────────────────────────────────────────────────────────────
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oilshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oilshop}
      POSTGRES_DB: oilshop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oilshop']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://oilshop:${POSTGRES_PASSWORD:-oilshop}@db:5432/oilshop?schema=public
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      APP_URL: ${APP_URL:-http://localhost:3000}

volumes:
  pgdata:
  redisdata:
